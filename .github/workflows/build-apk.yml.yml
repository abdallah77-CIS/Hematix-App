name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout source
      uses: actions/checkout@v4

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Generate Android platform folder
      run: |
        cd hematix_mobile
        flutter create --platforms=android --project-name=hematix_mobile .

    - name: Install dependencies
      run: |
        cd hematix_mobile
        flutter pub get

    - name: Build APK
      run: |
        cd hematix_mobile
        flutter build apk --release

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: release-apk
        path: hematix_mobile/build/app/outputs/flutter-apk/app-release.apk